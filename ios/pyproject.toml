# iPhone app of MusicFlow (BeeWare Briefcase). Built on a GitHub macOS runner
# (.github/workflows/ios.yml): the shared Python engine (android/app/src/main/python)
# is copied into src/musicflow/engine before the build. Installed with SideStore.
[tool.briefcase]
project_name = "MusicFlow"
bundle = "io.github.captentv1"
version = "3.6.2"
url = "https://github.com/captentv1/musicflow"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
author = "captentv1"
author_email = "captentv1@users.noreply.github.com"

[tool.briefcase.app.musicflow]
formal_name = "MusicFlow"
description = "Download music with the right title, artist, album, cover art and lyrics."
# markupsafe has no iOS wheel: its pure-Python version is copied into src/ by the CI
# (it falls back to Python code when its C speedups are missing).
sources = ["src/musicflow", "src/markupsafe"]
# Installed without dependencies (several pull compiled extras with no iOS wheel);
# every pure-Python dependency is listed explicitly instead.
requirement_installer_args = ["--no-deps"]
requires = [
    "flask",
    "werkzeug",
    "jinja2",
    "itsdangerous",
    "click",
    "blinker",
    "yt-dlp",
    "mutagen",
    "certifi",
]

[tool.briefcase.app.musicflow.iOS]
requires = [
    # listed one by one because requirements are installed with --no-deps
    "toga-iOS~=0.5.0",
    "toga-core~=0.5.0",
    "travertino~=0.5.0",
    "rubicon-objc",
    "fonttools",
    "typing-extensions",
    "std-nslog~=1.0.3",
]

[tool.briefcase.app.musicflow.iOS.info]
# The interface is served by the app itself on 127.0.0.1 (plain http).
NSAppTransportSecurity = { NSAllowsLocalNetworking = true }
# Downloads in the app's Documents folder, visible in the Files app.
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
