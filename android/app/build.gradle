apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.chaquo.python'

def proprietesCle = new Properties()
def fichierCle = file("C:/Users/skander/PROJETS/.cles/keystore.properties")
if (fichierCle.exists()) { fichierCle.withInputStream { proprietesCle.load(it) } }

android {
    signingConfigs {
        release {
            if (fichierCle.exists()) {
                storeFile file(proprietesCle["storeFile"])
                storePassword proprietesCle["storePassword"]
                keyAlias proprietesCle["keyAlias"]
                keyPassword proprietesCle["keyPassword"]
            }
        }
    }
    namespace 'com.musicflow.app'

    sourceSets {
        main {
            python.srcDirs = ['src/main/python', '../../core', '../../web']
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        buildConfigField "String", "CI_TOKEN", "\"${project.findProperty('ciToken') ?: ''}\""
        applicationId "com.musicflow.app"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('ciVersionCode') ?: '40').toString())
        versionName((project.findProperty('ciVersionName') ?: '3.11.0').toString())

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.13"
            buildPython "C:/dev/py313pkg/tools/python.exe"
            pip {
                install "yt-dlp"
                install "flask"
                install "certifi"
                install "mutagen"
                install "Pillow"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
}
