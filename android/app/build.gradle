apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.chaquo.python'

// Clé de signature de publication : gardée HORS du dépôt (PROJETS\.cles), jamais commitée
def proprietesCle = new Properties()
def fichierCle = file("C:/Users/skander/PROJETS/.cles/keystore.properties")
if (fichierCle.exists()) { fichierCle.withInputStream { proprietesCle.load(it) } }

android {
    signingConfigs {
        release {
            if (fichierCle.exists()) {
                storeFile file(proprietesCle["storeFile"])
                storePassword proprietesCle["storePassword"]
                keyAlias proprietesCle["keyAlias"]
                keyPassword proprietesCle["keyPassword"]
            }
        }
    }
    namespace 'com.musicflow.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.musicflow.app"
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName "3.0.3"

        ndk {
            // abiFilters restreint aux architectures les plus courantes pour réduire la taille de l'APK
            // Note : armeabi-v7a coûte ~8 Mo (natif + stdlib + requirements Chaquopy
            // sont dupliqués par architecture) et fait passer l'APK au-dessus de la
            // limite d'envoi de 30 Mo — il faut alors un autre canal de livraison.
            abiFilters "arm64-v8a"
        }

        python {
            version "3.13"
            buildPython "C:/dev/py313pkg/tools/python.exe"
            pip {
                install "yt-dlp"
                install "flask"
                install "certifi"
                install "mutagen"  // pochette + tags audio (m4a/mp3/opus) sans ffmpeg
                install "Pillow"   // conversion de la miniature (webp/png...) en JPEG pour la pochette
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    // ffmpeg (avec LAME/FLAC) : conversion au format choisi + suppression des silences
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
}
